[project]
name = "rankmark"
version = "0.1.0"
description = "Keyed rank-lens watermark: the model is the key"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
rankmark = "rankmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rankmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model weights, run with -m slow"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

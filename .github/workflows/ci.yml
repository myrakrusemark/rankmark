name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: python (fast tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU torch and the package
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (fast, no model weights)
        run: pytest -q

  web:
    name: web (reference vectors and fake-lens round trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vectors match the Python reference bit for bit
        run: node web/test/verify.mjs
      - name: Encoder to decoder round trip through a fake lens
        run: node web/test/engine_roundtrip.mjs
